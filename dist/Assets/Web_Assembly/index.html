<!DOCTYPE html>
<html>
<head>
  <title>Opossum Ride Adventure - WebAssembly Physics</title>
  <style>
    body { background: #000; color: #00ff00; font-family: monospace; padding: 20px; }
    h1 { border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
    pre { background: #111; padding: 15px; border: 1px solid #333; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>WebAssembly Physics Engine</h1>
  <p id="status">Status: Loading index.wasm...</p>
  <pre id="output"></pre>
  <script>
    fetch('./index.wasm')
      .then(response => response.arrayBuffer())
      .then(bytes => WebAssembly.instantiate(bytes))
      .then(results => {
        document.getElementById('status').innerText = 'Status: WebAssembly Loaded successfully!';
        const exports = results.instance.exports;
        
        let out = '';
        out += '--- Empirical Computations ---\n';
        out += 'calculate_force(75.0, 9.8): ' + exports.calculate_force(75.0, 9.8) + ' N\n';
        out += 'calculate_velocity(0.0, 2.5, 4.0): ' + exports.calculate_velocity(0.0, 2.5, 4.0) + ' m/s\n';
        out += 'calculate_distance(5.0, 10.0, 1.5): ' + exports.calculate_distance(5.0, 10.0, 1.5) + ' m\n';
        out += 'detect_collision(0, 0, 10, 15, 15, 10): ' + (exports.detect_collision(0, 0, 10, 15, 15, 10) ? 'YES' : 'NO') + '\n';
        
        document.getElementById('output').textContent = out;
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Status: Load failed - ' + err.message;
      });
  </script>
</body>
</html>
