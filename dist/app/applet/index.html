<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="Assets/Images/Opossum_Ride_Illustration.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opossum Ride Adventure</title>
    <meta name="description" content="Opossum Ride Adventure - Crafted with precision, mathematical logic, and ultra-broad security fortification." />
    <meta property="og:title" content="Opossum Ride Adventure" />
    <meta property="og:description" content="Opossum Ride Adventure - Crafted with precision, mathematical logic, and ultra-broad security fortification." />

    <!-- Multi-path CSS fallbacks for instant style rendering -->
    <link rel="stylesheet" id="app-style-primary" href="Assets/CSS/style.css" />
    <link rel="stylesheet" id="app-style-secondary" href="Assets/index.css" />
    <link rel="stylesheet" id="app-style-absolute" href="../../Opossum_Ride_Adventure/Assets/CSS/style.css" />

    <style>
      /* Base dark background and immediate visible loading state to prevent blank screen */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        color: #f3f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #fallback-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="../../Assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="../../Assets/index.css">
  </head>
  <body>
    <div id="root">
      <div id="fallback-loader">
        <div class="spinner"></div>
        <h2 style="font-size: 1.5rem; margin: 0 0 8px 0; font-weight: 600;">Opossum Ride Adventure</h2>
        <p style="color: #9ca3af; margin: 0; font-size: 0.95rem;">Initializing high-performance game engine...</p>
      </div>
    </div>

    <!-- Script fallbacks for both ES module and standard script execution -->

    <!-- Production bundle multi-path fallback script loader -->
    <script>
      (function() {
        var scriptsToTry = [
          'Assets/JS/index.js',
          'Assets/index.js',
          './Assets/JS/index.js',
          './Assets/index.js',
          '/Opossum_Ride_Adventure/Assets/JS/index.js',
          '/Opossum_Ride_Adventure/Assets/index.js'
        ];
        var loaded = false;

        function loadScript(index) {
          if (index >= scriptsToTry.length || loaded) return;
          var s = document.createElement('script');
          s.src = scriptsToTry[index];
          s.onload = function() {
            loaded = true;
            console.log('[Opossum Ride Adventure] Production script loaded successfully from:', scriptsToTry[index]);
          };
          s.onerror = function() {
            console.warn('[Opossum Ride Adventure] Failed to load script from:', scriptsToTry[index]);
            loadScript(index + 1);
          };
          document.head.appendChild(s);
        }

        // Delay 300ms to allow Vite dev module loader priority, then attempt production fallbacks if root is unmounted
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.querySelector('#fallback-loader')) {
            loadScript(0);
          }
        }, 300);
      })();
    </script>
  </body>
</html>
