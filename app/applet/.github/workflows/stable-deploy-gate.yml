name: Stable Deployment Gate (Main)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Type Check & Production Build
        run: npm run build

      - name: Verify Version 0.1.0.7.4 Stability
        run: |
          if [ ! -f "VERSION.txt" ]; then
            echo "Error: VERSION.txt missing!"
            exit 1
          fi
          VERSION=$(cat VERSION.txt | tr -d '[:space:]')
          echo "Verified stable version: $VERSION"
          if [ "$VERSION" != "0.1.0.7.4" ]; then
            echo "Error: Version mismatch! Expected 0.1.0.7.4, got $VERSION"
            exit 1
          fi
          echo "Stable deployment gate passed successfully for version $VERSION."
