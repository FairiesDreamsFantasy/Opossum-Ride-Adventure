name: Quality Gate - TypeScript TypeCheck & Build Verification

on:
  push:
    branches:
      - main
      - WorkspaceSync
      - Stable
      - QualityControl
      - development
  pull_request:
    branches:
      - main
      - WorkspaceSync
      - Stable
      - QualityControl
      - development

jobs:
  quality-gate:
    name: Verify TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 🛡️ Strict TypeScript Type-Check
        run: npx tsc --noEmit

      - name: ⚡ Vite Production Build Verification
        run: npm run build
