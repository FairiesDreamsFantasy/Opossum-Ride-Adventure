name: Automate Game Build for cPanel

# Trigger automated GitHub cloud compilation on push to active branches
on:
  push:
    branches:
      - main
      - WorkspaceSync
      - Stable
      - QualityControl
      - stable-cpanel-deployment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Game Bundle
        run: npm run build

      - name: Commit and Push Compiled Production Build
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Build: Compile clean production game bundle for cPanel"
          branch: ${{ github.ref_name }}
          file_pattern: "dist/** .cpanel.yml"
          skip_ci: true
